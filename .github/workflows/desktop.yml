name: Desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libayatana-appindicator3-dev libnotify-dev libsecret-1-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib bin tool test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python tool/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: imbroglio-${{ matrix.os }}
          path: dist/*
